[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-perception"
version = "0.1.0"
description = "Atlas Perception Layer - Python Migration"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[tool.setuptools.packages.find]
include = ["atlas_perception*"]
