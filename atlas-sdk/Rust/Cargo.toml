[package]
name = "atlas-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for the Atlas intelligent machine platform"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
url = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
