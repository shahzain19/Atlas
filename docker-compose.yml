version: "3.9"

services:
  runtime:
    build:
      context: .
      target: runtime
    ports:
      - "8080:8080"
    volumes:
      - atlas-storage:/app/storage
    environment:
      - NODE_ENV=production
    command: ["npx", "ts-node", "main.ts"]

  simulation:
    build:
      context: .
      target: deps
    ports:
      - "5174:5174"
    volumes:
      - .:/app
    working_dir: /app/atlas-simulation
    environment:
      ATLAS_API_URL: http://runtime:8080
    command:
      - sh
      - -c
      - "npm install 2>/dev/null; npx vite --host 0.0.0.0 --port 5174"
    depends_on:
      - runtime

  studio:
    build:
      context: .
      target: deps
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    working_dir: /app/atlas-studio
    environment:
      ATLAS_API_URL: http://runtime:8080
    command:
      - sh
      - -c
      - "npm install 2>/dev/null; npx vite --host 0.0.0.0 --port 3000"
    depends_on:
      - runtime

  perception-py:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "9090:9090"
    volumes:
      - .:/app
    working_dir: /app/atlas-perception-py
    environment:
      ATLAS_WS_URL: ws://runtime:8080/api/ws
    command:
      - sh
      - -c
      - "pip install -e . && python perception_daemon.py"
    depends_on:
      - runtime

  test:
    profiles:
      - test
    build:
      context: .
      target: deps
    volumes:
      - .:/app
    command: ["npm", "test"]

volumes:
  atlas-storage:
